name: Make paper-core public

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish 0.1.0 with full log
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wegooli/paper-core build

      - name: Publish and show npm's own log
        working-directory: packages/paper-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --loglevel verbose

      - name: Confirm anonymous install can see 0.1.0
        run: |
          code=$(curl -sS -o /tmp/pkg.json -w "%{http_code}" https://registry.npmjs.org/@wegooli%2fpaper-core)
          echo "anonymous registry status $code"
          cat /tmp/pkg.json
          test "$code" = "200"
